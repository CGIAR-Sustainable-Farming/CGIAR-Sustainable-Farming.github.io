name: Refresh and deploy SFP hub
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"
  repository_dispatch:
    types: [records-updated]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: sfp-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run ci
      - name: Refresh sources, validate, type-check and build
        run: bun run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
